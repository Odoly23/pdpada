{% extends "main/layout.html" %}
{% load crispy_forms_tags %}
{% block content %}
<ol class="breadcrumb mb-2 mt-1">
	<li class="breadcrumb-item"><a href="{% url 'home' %}">VARANDA</a></li>
	<li class="breadcrumb-item active" aria-current="page">TROKA PASSWORD</li>
</ol>
<div class="row"><div class="col-md-6">
	<div class="card shadow-lg rounded">
		<div class="card-header">TROKA PASSWORD</div>
		<div class="card-body">
			<form method="post" novalidate>{% csrf_token %}
				{{ form|crispy }}
				<a class="btn btn-secondary" href="{% url 'home' %}"><i class="fa fa-close"></i> Cancela</a>
				<button class="btn btn-primary" type="submit">Rai <i class="fa fa-save"></i></button>
			</form>
		</div>
	</div>
</div></div>
{% endblock %}
