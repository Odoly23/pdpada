{% load static %}<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDPADA{% endblock %} · Sistema Membru Partidu</title>
  <link rel="stylesheet" href="{% static 'main/vendor/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'main/vendor/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'main/vendor/css/dataTables.bootstrap4.min.css' %}">
  <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body>
{% include "main/navbar.html" %}
<main class="container-fluid px-4 mt-3">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
      {{ message }}<button type="button" class="close" data-dismiss="alert" aria-label="Taka"><span>&times;</span></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{% static 'main/vendor/js/jquery.min.js' %}"></script>
<script src="{% static 'main/vendor/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'main/vendor/js/jquery.dataTables.min.js' %}"></script>
<script src="{% static 'main/vendor/js/dataTables.bootstrap4.min.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
