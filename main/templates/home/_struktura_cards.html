{% if struktura.cards %}
<h6 class="rekap-head">{{ struktura.title }}</h6>
<div class="row">
	{% for c in struktura.cards %}
	<div class="col-6 col-md-4 col-lg-3 mb-3">
		<a class="card aldeia-card h-100 suku-card" href="{{ c.url }}">
			<div class="card-body text-center">
				<div class="aldeia-name">{{ c.label }}</div>
				<div class="aldeia-n">{{ c.n }}</div>
			</div>
		</a>
	</div>
	{% endfor %}
</div>
{% endif %}
