{% extends "main/layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card shadow-lg">
    <div class="card-header text-center"><i class="fa fa-lock"></i> LOGIN SISTEMA PDPADA</div>
    <div class="card-body">
      {% if form.errors %}<div class="alert alert-danger">Username ka password la loos.</div>{% endif %}
      <form method="post" autocomplete="off">{% csrf_token %}
        <div class="form-group"><label for="id_username">Username</label>
          <input type="text" name="username" id="id_username" class="form-control" required autofocus autocapitalize="none"></div>
        <div class="form-group"><label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password"></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary btn-block" type="submit">Tama</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
